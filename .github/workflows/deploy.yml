name: Deploy DateSense to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: "pages"
  # Never cancel an in-flight production deploy — queued runs simply wait.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    # The gateway rejects unauthenticated /api calls with 401, so the key has to
    # reach the bundle. It is substituted here rather than committed: this repo
    # is public. Fail loudly if it is missing, otherwise we would ship a build
    # that 401s for every visitor.
    - name: Inject AI Gateway API key
      env:
        AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      run: |
        test -n "$AI_GATEWAY_API_KEY" || { echo "::error::AI_GATEWAY_API_KEY secret is not set"; exit 1; }
        grep -q '__AI_GATEWAY_API_KEY__' src/environments/environment.prod.ts
        sed -i "s|__AI_GATEWAY_API_KEY__|$AI_GATEWAY_API_KEY|" src/environments/environment.prod.ts

    - name: Build application
      run: npx ng build --base-href /DateSense/

    - name: Create .nojekyll and 404.html for SPA routing
      run: |
        touch dist/DateSense/browser/.nojekyll
        cp dist/DateSense/browser/index.html dist/DateSense/browser/404.html

    - name: Upload artifact
      if: github.event_name == 'push'
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist/DateSense/browser'

  # Only pushes to main reach production. A pull request builds and tests, but
  # must never publish its branch to the live site.
  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
