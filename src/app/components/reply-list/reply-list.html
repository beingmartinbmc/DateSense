<mat-card appearance="outlined" class="reply-card">
  <mat-card-content>
    <h3 class="section-title">Suggested Replies</h3>

    <!-- Tone selector -->
    <div class="tone-bar" role="group" aria-label="Choose a reply tone">
      <span class="tone-label">Tone:</span>
      @for (tone of tones; track tone) {
        <button
          type="button"
          class="tone-chip"
          [class.active]="activeTone() === tone"
          [disabled]="isRegenerating()"
          (click)="regenerate(tone)">
          {{ tone }}
        </button>
      }
    </div>

    @if (regenError(); as err) {
      <p class="tone-error"><mat-icon>error_outline</mat-icon> {{ err }}</p>
    }

    @if (isRegenerating()) {
      <div class="tone-loading">
        <mat-spinner diameter="22"></mat-spinner>
        <span>Rewriting replies in a {{ activeTone() }} tone…</span>
      </div>
    } @else {
      <div class="reply-list">
        @for (reply of displayReplies(); track $index) {
          <div class="reply-row">
            <div class="reply-body">
              <span class="reply-num">{{ $index + 1 }}</span>
              <p class="reply-text">{{ reply }}</p>
            </div>
            <button mat-stroked-button class="copy-btn" [class.copied]="copiedIndex() === $index"
              (click)="copyReply(reply, $index)">
              <mat-icon>{{ copiedIndex() === $index ? 'check' : 'content_copy' }}</mat-icon>
              {{ copiedIndex() === $index ? 'Copied' : 'Copy' }}
            </button>
          </div>
        }
      </div>
    }
  </mat-card-content>
</mat-card>
